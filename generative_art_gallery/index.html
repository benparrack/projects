<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generative Art Gallery</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0b0b10;
    color: #ddd;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px 0 32px;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 900px;
  }
  button, select {
    background: #1b1b24;
    color: #ddd;
    border: 1px solid #444;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: 3px;
  }
  button:hover, select:hover { border-color: #888; }
  #toolbar label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: #bbb;
    cursor: pointer;
    user-select: none;
  }
  #info {
    margin-left: auto;
    font-size: 12px;
    color: #777;
  }
  canvas {
    background: #000;
    border: 2px solid #333;
  }
  #hint {
    width: 900px;
    font-size: 12px;
    color: #555;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="toolbar">
    <button id="regenBtn">Regenerate (space)</button>
    <button id="saveBtn">Save PNG (s)</button>
    <label><input type="checkbox" id="darkModeCheckbox"> Dark mode only</label>
    <label><input type="checkbox" id="blackHoleCheckbox"> Black hole</label>
    <label><input type="checkbox" id="animationCheckbox"> Animation</label>
    <span id="info"></span>
  </div>
  <canvas id="canvas" width="900" height="900"></canvas>
  <div id="hint">Each piece is a noise-driven flow field with a random seed, palette, and field style. Click Regenerate (or press space) for a new one.</div>
</div>

<script>
// ---------- Seeded PRNG (mulberry32) ----------
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Classic 2D Perlin noise, seeded via the PRNG above ----------
class PerlinNoise2D {
  constructor(rand) {
    const perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    this.p = new Uint8Array(512);
    for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
  }
  static fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  static lerp(t, a, b) { return a + t * (b - a); }
  static grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = PerlinNoise2D.fade(x), v = PerlinNoise2D.fade(y);
    const p = this.p;
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1];
    const ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    return PerlinNoise2D.lerp(v,
      PerlinNoise2D.lerp(u, PerlinNoise2D.grad(aa, x, y), PerlinNoise2D.grad(ba, x - 1, y)),
      PerlinNoise2D.lerp(u, PerlinNoise2D.grad(ab, x, y - 1), PerlinNoise2D.grad(bb, x - 1, y - 1))
    );
  }
}

// ---------- Curated color palettes (order = dark -> light / base -> accent) ----------
const PALETTES = [
  ["#0d1b2a", "#1b263b", "#415a77", "#778da9", "#e0e1dd"],
  ["#22223b", "#4a4e69", "#9a8c98", "#c9ada7", "#f2e9e4"],
  ["#03045e", "#023e8a", "#0077b6", "#0096c7", "#00b4d8", "#48cae4", "#90e0ef", "#ade8f4"],
  ["#240046", "#3c096c", "#5a189a", "#7b2cbf", "#9d4edd", "#c77dff"],
  ["#1b4332", "#2d6a4f", "#40916c", "#52b788", "#74c69d", "#95d5b2", "#b7e4c7"],
  ["#3a0ca3", "#7209b7", "#f72585", "#4361ee", "#4cc9f0"],
  ["#641220", "#6e1423", "#85182a", "#a11d33", "#c71f37", "#e01e37", "#f7286d"],
  ["#293241", "#3d5a80", "#98c1d9", "#e0fbfc", "#ee6c4d"],
];

function pick(rand, arr) { return arr[Math.floor(rand() * arr.length)]; }
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mixHex(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(a[0] + (b[0] - a[0]) * t);
  const g = Math.round(a[1] + (b[1] - a[1]) * t);
  const bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return `rgb(${r},${g},${bl})`;
}
// On a light background, palette colors (mostly chosen to pop on black) need
// darkening to stay legible instead of washing out.
function contrastRgb([r, g, b], bgIsLight) {
  return bgIsLight ? [Math.round(r * 0.55), Math.round(g * 0.55), Math.round(b * 0.55)] : [r, g, b];
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

let rand, noise, palette, rafId;
const infoEl = document.getElementById("info");
const animationCheckbox = document.getElementById("animationCheckbox");

function newSeed() {
  return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
}

// Lets "Animation" be toggled on after a piece has already finished its
// normal run and stopped — resumeFrame/animationRunning let the checkbox's
// change handler kick the same closure's loop back into motion rather than
// only affecting future pieces.
let resumeFrame = null;
let animationRunning = false;

// ---------- Flow field renderer ----------
// Three distinct field "shapes" and three color strategies, mixed with wide
// parameter ranges, so consecutive pieces read as genuinely different works
// rather than the same noise pattern with a new palette.
function fieldAngle(style, x, y, scale, curl, cx, cy) {
  const n = noise.noise(x * scale, y * scale);
  if (style === "swirl") {
    const radial = Math.atan2(y - cy, x - cx) + Math.PI / 2;
    return n * Math.PI * curl * 0.6 + radial;
  }
  if (style === "waves") {
    return Math.sin(x * scale * 3 + n * Math.PI * 2) * Math.PI * 0.9 + Math.cos(y * scale * 3) * Math.PI * 0.5;
  }
  return n * Math.PI * curl; // "curl"
}

function runFlowField(bgIsLight) {
  const bgColor = bgIsLight ? mixHex("#ffffff", palette[palette.length - 1], 0.12) : mixHex("#000000", palette[0], 0.15);
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);

  const fieldStyle = pick(rand, ["curl", "swirl", "waves"]);
  const colorStrategy = pick(rand, ["random", "noise", "angle"]);
  const scale = 0.0025 + rand() * 0.006;
  const curl = 1.5 + rand() * 4;
  const swirlCx = W * (0.3 + rand() * 0.4);
  const swirlCy = H * (0.3 + rand() * 0.4);
  const particleCount = 500 + Math.floor(rand() * 1600);
  const stepSize = 1.0 + rand() * 1.6;
  const stepsPerFrame = 6;
  const maxLife = 200 + Math.floor(rand() * 260);
  const baseAlpha = 0.06 + rand() * 0.12;
  const lineWidth = 0.8 + rand() * 1.6;

  function spawnColor(x, y) {
    if (colorStrategy === "noise") {
      const idx = Math.floor(((noise.noise(x * 0.004, y * 0.004) + 1) / 2) * palette.length);
      return palette[Math.min(palette.length - 1, Math.max(0, idx))];
    }
    if (colorStrategy === "angle") {
      const a = Math.atan2(y - H / 2, x - W / 2);
      const idx = Math.floor(((a + Math.PI) / (2 * Math.PI)) * palette.length);
      return palette[Math.min(palette.length - 1, Math.max(0, idx))];
    }
    return pick(rand, palette);
  }

  const particles = [];
  for (let i = 0; i < particleCount; i++) {
    const x = rand() * W, y = rand() * H;
    particles.push({ x, y, life: Math.floor(rand() * maxLife), color: spawnColor(x, y) });
  }

  let steps = 0;
  const totalSteps = maxLife + 40;

  function frame() {
    for (let s = 0; s < stepsPerFrame; s++) {
      for (const p of particles) {
        const angle = fieldAngle(fieldStyle, p.x, p.y, scale, curl, swirlCx, swirlCy);
        const nx = p.x + Math.cos(angle) * stepSize;
        const ny = p.y + Math.sin(angle) * stepSize;

        const [r, g, b] = contrastRgb(hexToRgb(p.color), bgIsLight);
        ctx.strokeStyle = `rgba(${r},${g},${b},${baseAlpha})`;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(nx, ny);
        ctx.stroke();

        p.x = nx; p.y = ny;
        p.life++;
        if (p.life > maxLife || p.x < 0 || p.x > W || p.y < 0 || p.y > H) {
          p.x = rand() * W;
          p.y = rand() * H;
          p.life = 0;
          p.color = spawnColor(p.x, p.y);
        }
      }
    }
    steps++;
    if (steps < totalSteps || animationCheckbox.checked) {
      animationRunning = true;
      rafId = requestAnimationFrame(frame);
    } else {
      animationRunning = false;
    }
  }
  resumeFrame = frame;
  animationRunning = true;
  frame();
  return `flow field (${fieldStyle}, color=${colorStrategy})  scale=${scale.toFixed(4)}  curl=${curl.toFixed(2)}`;
}

// ---------- Black hole renderer ----------
// An accretion disk of particles orbiting a solid event horizon: angular
// speed and inward drift both increase near the horizon (loosely Keplerian),
// particles are "swallowed" and respawned at the disk's outer edge, and the
// horizon + a warm photon-ring glow are repainted on top every frame so nothing
// ever appears to cross in front of the void.
const HOT_CORE_COLORS = ["#eaf6ff", "#bfe4ff", "#8ecbff", "#5aa9ff", "#ffffff"];

function runBlackHole() {
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);

  const starCount = 150 + Math.floor(rand() * 200);
  for (let i = 0; i < starCount; i++) {
    const b = 90 + Math.floor(rand() * 165);
    ctx.fillStyle = `rgba(${b},${b},${b},${0.25 + rand() * 0.55})`;
    ctx.fillRect(rand() * W, rand() * H, 1, 1);
  }

  const cx = W / 2 + (rand() - 0.5) * W * 0.06;
  const cy = H / 2 + (rand() - 0.5) * H * 0.06;
  const horizonRadius = Math.min(W, H) * (0.06 + rand() * 0.05);
  const diskOuter = horizonRadius * (3.2 + rand() * 1.6);
  const diskSquish = 0.3 + rand() * 0.3;
  const particleCount = 900 + Math.floor(rand() * 900);
  const stepsPerFrame = 6;
  const totalSteps = 320 + Math.floor(rand() * 200);

  function spawnParticle() {
    return { angle: rand() * Math.PI * 2, dist: horizonRadius * (1.3 + rand() * (diskOuter / horizonRadius - 1.3)) };
  }
  function colorForRadiusFrac(rFrac) {
    return rFrac < 0.35 ? pick(rand, HOT_CORE_COLORS) : pick(rand, palette);
  }
  function drawHorizon() {
    const glowRadius = horizonRadius * 2.2;
    const grad = ctx.createRadialGradient(cx, cy, horizonRadius * 0.9, cx, cy, glowRadius);
    grad.addColorStop(0, "rgba(255,235,190,0.9)");
    grad.addColorStop(0.18, "rgba(255,205,150,0.5)");
    grad.addColorStop(0.45, "rgba(255,180,120,0.12)");
    grad.addColorStop(1, "rgba(255,180,120,0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(cx, cy, horizonRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  const particles = [];
  for (let i = 0; i < particleCount; i++) particles.push(spawnParticle());

  let steps = 0;
  function frame() {
    for (let s = 0; s < stepsPerFrame; s++) {
      for (const p of particles) {
        const prevAngle = p.angle, prevDist = p.dist;
        const angularSpeed = 0.05 * Math.pow(horizonRadius / p.dist, 1.5) + 0.002;
        p.angle += angularSpeed;
        p.dist -= (0.05 + 0.35 * (horizonRadius / p.dist));

        const rFrac = Math.min(1, Math.max(0, (p.dist - horizonRadius) / (diskOuter - horizonRadius)));
        const [r, g, b] = hexToRgb(colorForRadiusFrac(rFrac));

        ctx.strokeStyle = `rgba(${r},${g},${b},${0.16 + 0.3 * (1 - rFrac)})`;
        ctx.lineWidth = 0.8 + 1.6 * (1 - rFrac);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(prevAngle) * prevDist, cy + Math.sin(prevAngle) * prevDist * diskSquish);
        ctx.lineTo(cx + Math.cos(p.angle) * p.dist, cy + Math.sin(p.angle) * p.dist * diskSquish);
        ctx.stroke();

        if (p.dist <= horizonRadius * 1.05) Object.assign(p, spawnParticle());
      }
    }
    drawHorizon();
    steps++;
    if (steps < totalSteps || animationCheckbox.checked) {
      animationRunning = true;
      rafId = requestAnimationFrame(frame);
    } else {
      animationRunning = false;
    }
  }
  resumeFrame = frame;
  animationRunning = true;
  frame();
  return `black hole  horizon=${horizonRadius.toFixed(0)}px`;
}

function generate() {
  if (rafId) cancelAnimationFrame(rafId);
  const seed = newSeed();
  rand = mulberry32(seed);
  noise = new PerlinNoise2D(rand);
  palette = pick(rand, PALETTES);

  const darkModeOnly = document.getElementById("darkModeCheckbox").checked;
  const blackHoleOnly = document.getElementById("blackHoleCheckbox").checked;

  let detail;
  if (blackHoleOnly) {
    detail = runBlackHole();
  } else {
    const bgIsLight = darkModeOnly ? false : rand() < 0.3;
    detail = runFlowField(bgIsLight);
  }
  infoEl.textContent = `seed=${seed}  ${detail}`;
}

document.getElementById("regenBtn").addEventListener("click", () => generate());
document.getElementById("darkModeCheckbox").addEventListener("change", () => generate());
document.getElementById("blackHoleCheckbox").addEventListener("change", () => generate());
animationCheckbox.addEventListener("change", () => {
  if (animationCheckbox.checked && !animationRunning && resumeFrame) {
    animationRunning = true;
    rafId = requestAnimationFrame(resumeFrame);
  }
});
document.getElementById("saveBtn").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = `generative-art-${Date.now()}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); generate(); }
  if (e.key === "s" || e.key === "S") document.getElementById("saveBtn").click();
});

generate();
</script>
</body>
</html>
