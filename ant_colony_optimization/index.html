<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ant Colony Optimization Visualizer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #14161a;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 12px;
    color: #f0f0f0;
    letter-spacing: 0.02em;
  }
  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    max-width: 960px;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #b8b8b8;
    padding-left: 8px;
    border-left: 1px solid #33373f;
  }
  .control-group:first-child { border-left: none; padding-left: 0; }
  .control-group label { display: flex; align-items: center; gap: 6px; }
  .control-group input[type="range"] { width: 90px; }
  .valspan { color: #e8e8e8; font-variant-numeric: tabular-nums; min-width: 2.5em; display: inline-block; }
  button.action {
    padding: 7px 14px;
    border-radius: 6px;
    border: none;
    background: #3a3040;
    color: #e8e8e8;
    font-size: 13px;
    cursor: pointer;
  }
  button.action:hover { background: #4a3d54; }
  #canvasWrap, #chartWrap {
    border: 1px solid #33373f;
    border-radius: 8px;
    overflow: hidden;
    line-height: 0;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  #chartWrap { margin-top: 10px; }
  canvas { display: block; background: #0d0e12; }
  #hint {
    margin-top: 10px;
    font-size: 12px;
    color: #777;
    text-align: center;
    max-width: 720px;
  }
</style>
</head>
<body>
<h1>Ant Colony Optimization Visualizer</h1>
<div id="toolbar">
  <div class="control-group">
    <button class="action" id="randomizeBtn">Randomize</button>
  </div>
  <div class="control-group">
    <label>Cities <input type="range" id="citiesSlider" min="8" max="40" value="20" step="1"><span class="valspan" id="citiesVal">20</span></label>
  </div>
  <div class="control-group">
    <label>Ants <input type="range" id="antsSlider" min="5" max="50" value="20" step="1"><span class="valspan" id="antsVal">20</span></label>
  </div>
  <div class="control-group">
    <label>&alpha; <input type="range" id="alphaSlider" min="0" max="5" value="1" step="0.1"><span class="valspan" id="alphaVal">1.0</span></label>
    <label>&beta; <input type="range" id="betaSlider" min="0" max="5" value="3" step="0.1"><span class="valspan" id="betaVal">3.0</span></label>
  </div>
  <div class="control-group">
    <label>&rho; <input type="range" id="rhoSlider" min="0.01" max="0.9" value="0.5" step="0.01"><span class="valspan" id="rhoVal">0.50</span></label>
  </div>
  <div class="control-group">
    <label>Speed <input type="range" id="speedSlider" min="20" max="400" value="120" step="10"><span class="valspan" id="speedVal">120</span></label>
    <button class="action" id="pauseBtn">Pause</button>
  </div>
  <div class="control-group">
    <button class="action" id="resetTrailsBtn">Reset trails</button>
  </div>
</div>
<div id="canvasWrap"><canvas id="canvas" width="720" height="460"></canvas></div>
<div id="chartWrap"><canvas id="chartCanvas" width="720" height="120"></canvas></div>
<div id="hint">Iteration 0</div>

<script>
// ---------- Seeded PRNG (mulberry32) ----------
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Graph setup ----------
function generateCities(rand, n, w, h, minDist = 30, margin = 30) {
  const cities = [];
  for (let i = 0; i < n; i++) {
    let placed = false;
    for (let attempt = 0; attempt < 50; attempt++) {
      const x = margin + rand() * (w - 2 * margin);
      const y = margin + rand() * (h - 2 * margin);
      let ok = true;
      for (const c of cities) {
        const dx = c.x - x, dy = c.y - y;
        if (dx * dx + dy * dy < minDist * minDist) { ok = false; break; }
      }
      if (ok) { cities.push({ x, y }); placed = true; break; }
    }
    if (!placed) {
      cities.push({ x: margin + rand() * (w - 2 * margin), y: margin + rand() * (h - 2 * margin) });
    }
  }
  return cities;
}

function buildDistanceMatrix(cities) {
  const n = cities.length;
  const dist = [];
  for (let i = 0; i < n; i++) dist.push(new Float64Array(n));
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const dx = cities[i].x - cities[j].x, dy = cities[i].y - cities[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      dist[i][j] = d;
      dist[j][i] = d;
    }
  }
  return dist;
}

function initPheromones(n, tau0 = 1) {
  return new Float64Array(n * n).fill(tau0);
}

// ---------- ACO core ----------
function constructTour(start, pheromone, dist, n, alpha, beta, rand) {
  const visited = new Uint8Array(n);
  const order = [start];
  visited[start] = 1;
  let current = start;
  for (let step = 1; step < n; step++) {
    const candidates = [];
    let sum = 0;
    for (let j = 0; j < n; j++) {
      if (visited[j]) continue;
      const tau = pheromone[current * n + j];
      const d = dist[current][j];
      const eta = d > 0 ? 1 / d : 1e6;
      const w = Math.pow(tau, alpha) * Math.pow(eta, beta);
      candidates.push([j, w]);
      sum += w;
    }
    let next;
    if (!(sum > 0) || !isFinite(sum)) {
      next = candidates[Math.floor(rand() * candidates.length)][0];
    } else {
      let r = rand() * sum;
      next = candidates[candidates.length - 1][0];
      for (const [j, w] of candidates) {
        if (r < w) { next = j; break; }
        r -= w;
      }
    }
    visited[next] = 1;
    order.push(next);
    current = next;
  }
  let length = 0;
  for (let i = 0; i < n; i++) length += dist[order[i]][order[(i + 1) % n]];
  return { order, length };
}

function depositTour(pheromone, n, order, delta) {
  for (let i = 0; i < order.length; i++) {
    const a = order[i], b = order[(i + 1) % order.length];
    pheromone[a * n + b] += delta;
    pheromone[b * n + a] += delta;
  }
}

function updatePheromones(state, tours) {
  const { pheromone, n, rho } = state;
  const floor = 1e-4;
  for (let i = 0; i < pheromone.length; i++) {
    pheromone[i] = Math.max(pheromone[i] * (1 - rho), floor);
  }
  const Q = 100;
  for (const t of tours) depositTour(pheromone, n, t.order, Q / t.length);
  if (state.bestTour) depositTour(pheromone, n, state.bestTour, 2 * Q / state.bestLength);
}

function runAnts(state) {
  const tours = [];
  for (let k = 0; k < state.m; k++) {
    const start = Math.floor(state.rand() * state.n);
    tours.push(constructTour(start, state.pheromone, state.dist, state.n, state.alpha, state.beta, state.rand));
  }
  return tours;
}

// ---------- State ----------
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const chartCanvas = document.getElementById('chartCanvas');
const chartCtx = chartCanvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const hint = document.getElementById('hint');

const citiesSlider = document.getElementById('citiesSlider');
const antsSlider = document.getElementById('antsSlider');
const alphaSlider = document.getElementById('alphaSlider');
const betaSlider = document.getElementById('betaSlider');
const rhoSlider = document.getElementById('rhoSlider');
const speedSlider = document.getElementById('speedSlider');
const citiesVal = document.getElementById('citiesVal');
const antsVal = document.getElementById('antsVal');
const alphaVal = document.getElementById('alphaVal');
const betaVal = document.getElementById('betaVal');
const rhoVal = document.getElementById('rhoVal');
const speedVal = document.getElementById('speedVal');
const randomizeBtn = document.getElementById('randomizeBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetTrailsBtn = document.getElementById('resetTrailsBtn');

const state = {
  seed: 0, rand: null,
  n: 20, cities: [], dist: [],
  pheromone: null,
  alpha: 1, beta: 3, rho: 0.5, m: 20,
  bestTour: null, bestLength: Infinity,
  history: [], iteration: 0,
  paused: false, speed: 120,
};

let anim = null;
let rafId = null;

function scheduleFrame() { rafId = requestAnimationFrame(animFrame); }

function animFrame(now) {
  if (!anim) return;
  if (anim.startTime === null) anim.startTime = now;
  const totalDuration = anim.segDuration * anim.totalSegs;
  const elapsed = now - anim.startTime;
  const progress = Math.min(elapsed / totalDuration, 1);
  draw(anim.tours, progress);
  if (progress < 1) {
    scheduleFrame();
  } else {
    finishIteration(anim.tours);
  }
}

function finishIteration(tours) {
  updatePheromones(state, tours);
  let iterBest = Infinity;
  for (const t of tours) {
    if (t.length < iterBest) iterBest = t.length;
    if (t.length < state.bestLength) { state.bestLength = t.length; state.bestTour = t.order.slice(); }
  }
  state.history.push({ iterBest, best: state.bestLength });
  state.iteration++;
  updateStatus();
  drawChart();
  draw(tours, 1);
  if (!state.paused) startNextIteration();
}

function startNextIteration() {
  const tours = runAnts(state);
  anim = { tours, startTime: null, segDuration: state.speed, totalSegs: state.n, pausedAt: null };
  scheduleFrame();
}

// ---------- Rendering ----------
function draw(tours, progress) {
  ctx.clearRect(0, 0, W, H);
  const n = state.n;
  let maxTau = 0;
  for (let i = 0; i < state.pheromone.length; i++) if (state.pheromone[i] > maxTau) maxTau = state.pheromone[i];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const tau = state.pheromone[i * n + j];
      const norm = maxTau > 0 ? tau / maxTau : 0;
      if (norm < 0.02) continue;
      ctx.beginPath();
      ctx.moveTo(state.cities[i].x, state.cities[i].y);
      ctx.lineTo(state.cities[j].x, state.cities[j].y);
      ctx.strokeStyle = `rgba(90, 200, 255, ${0.08 + 0.75 * norm})`;
      ctx.lineWidth = 1 + 6 * norm;
      ctx.stroke();
    }
  }
  if (state.bestTour) {
    ctx.beginPath();
    for (let i = 0; i <= state.bestTour.length; i++) {
      const c = state.cities[state.bestTour[i % state.bestTour.length]];
      if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y);
    }
    ctx.strokeStyle = 'rgba(255, 200, 60, 0.85)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }
  for (const c of state.cities) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#e8e8e8';
    ctx.fill();
  }
  if (tours) {
    const totalSegs = n;
    const segFloat = progress * totalSegs;
    let segIdx = Math.floor(segFloat);
    if (segIdx >= totalSegs) segIdx = totalSegs - 1;
    const localT = segFloat - segIdx;
    for (const t of tours) {
      const a = state.cities[t.order[segIdx]];
      const b = state.cities[t.order[(segIdx + 1) % n]];
      const x = a.x + (b.x - a.x) * localT;
      const y = a.y + (b.y - a.y) * localT;
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ff6a6a';
      ctx.fill();
    }
  }
}

function drawChart() {
  const w = chartCanvas.width, h = chartCanvas.height;
  chartCtx.clearRect(0, 0, w, h);
  const hist = state.history;
  if (hist.length < 2) return;
  let minV = Infinity, maxV = -Infinity;
  for (const p of hist) {
    minV = Math.min(minV, p.best, p.iterBest);
    maxV = Math.max(maxV, p.best, p.iterBest);
  }
  if (maxV === minV) maxV = minV + 1;
  const pad = 8;
  const xStep = (w - 2 * pad) / (hist.length - 1);
  function plot(key, color, lw) {
    chartCtx.beginPath();
    for (let i = 0; i < hist.length; i++) {
      const x = pad + i * xStep;
      const y = h - pad - ((hist[i][key] - minV) / (maxV - minV)) * (h - 2 * pad);
      if (i === 0) chartCtx.moveTo(x, y); else chartCtx.lineTo(x, y);
    }
    chartCtx.strokeStyle = color;
    chartCtx.lineWidth = lw;
    chartCtx.stroke();
  }
  plot('iterBest', 'rgba(150,150,160,0.6)', 1);
  plot('best', 'rgba(255,200,60,0.9)', 2);
}

function updateStatus() {
  hint.textContent = `Iteration ${state.iteration} — best tour length: ${isFinite(state.bestLength) ? state.bestLength.toFixed(1) : '—'} (α=${state.alpha.toFixed(1)}, β=${state.beta.toFixed(1)}, ρ=${state.rho.toFixed(2)})`;
}

// ---------- Lifecycle ----------
function newGraph() {
  if (rafId) cancelAnimationFrame(rafId);
  anim = null;
  state.seed = Math.floor(Math.random() * 1e9);
  state.rand = mulberry32(state.seed);
  state.n = Math.max(3, parseInt(citiesSlider.value, 10));
  state.cities = generateCities(state.rand, state.n, W, H);
  state.dist = buildDistanceMatrix(state.cities);
  state.pheromone = initPheromones(state.n, 1);
  state.bestTour = null;
  state.bestLength = Infinity;
  state.history = [];
  state.iteration = 0;
  state.paused = false;
  pauseBtn.textContent = 'Pause';
  updateStatus();
  drawChart();
  draw(null, 0);
  startNextIteration();
}

function resetTrails() {
  state.pheromone = initPheromones(state.n, 1);
  state.bestTour = null;
  state.bestLength = Infinity;
  state.history = [];
  state.iteration = 0;
  updateStatus();
  drawChart();
}

function togglePause() {
  state.paused = !state.paused;
  if (state.paused) {
    if (rafId) cancelAnimationFrame(rafId);
    if (anim) anim.pausedAt = performance.now();
  } else {
    if (anim && anim.pausedAt != null) {
      anim.startTime += performance.now() - anim.pausedAt;
      anim.pausedAt = null;
      scheduleFrame();
    } else if (!anim) {
      startNextIteration();
    }
  }
  pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
}

// ---------- Controls wiring ----------
randomizeBtn.addEventListener('click', newGraph);
resetTrailsBtn.addEventListener('click', resetTrails);
pauseBtn.addEventListener('click', togglePause);

citiesSlider.addEventListener('input', () => { citiesVal.textContent = citiesSlider.value; });
citiesSlider.addEventListener('change', newGraph);

antsSlider.addEventListener('input', () => {
  state.m = parseInt(antsSlider.value, 10);
  antsVal.textContent = antsSlider.value;
});
alphaSlider.addEventListener('input', () => {
  state.alpha = parseFloat(alphaSlider.value);
  alphaVal.textContent = state.alpha.toFixed(1);
  updateStatus();
});
betaSlider.addEventListener('input', () => {
  state.beta = parseFloat(betaSlider.value);
  betaVal.textContent = state.beta.toFixed(1);
  updateStatus();
});
rhoSlider.addEventListener('input', () => {
  state.rho = parseFloat(rhoSlider.value);
  rhoVal.textContent = state.rho.toFixed(2);
  updateStatus();
});
speedSlider.addEventListener('input', () => {
  state.speed = parseInt(speedSlider.value, 10);
  speedVal.textContent = speedSlider.value;
});

newGraph();
</script>
</body>
</html>
