<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Bot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231f4d3a'/><text x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='17' font-style='italic' fill='%23f3f0e8'>ib</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root { --bg:#f3f0e8; --card:#fbfaf6; --ink:#1c1a16; --muted:#6b665c; --line:#ddd7ca; --line-2:#c9c1b0; --chip:#ebe6da;
  --accent:#1f4d3a; --accent-ink:#f7f4ec; --signal:#b4471c; --good:#2f6b3f; --warn:#94650f; --bad:#a3321f;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif; --sans:"IBM Plex Sans", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace; --r:4px; --r2:3px; }
@media (prefers-color-scheme: dark) { :root { --bg:#15140f; --card:#1c1b16; --ink:#ece7db; --muted:#9b9486; --line:#2e2c25; --line-2:#433f35;
  --chip:#25231d; --accent:#8fbf9f; --accent-ink:#13130f; --signal:#e0794a; --good:#8fbf9f; --warn:#d9a74a; --bad:#e07a64; } }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--sans); }
a { color:var(--accent); text-underline-offset:2px; }
::selection { background:var(--accent); color:var(--accent-ink); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line-2); }
.bar { max-width:1080px; margin:auto; padding:16px 16px 10px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.brand { margin-right:auto; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
h1 { font:500 25px/1 var(--serif); letter-spacing:-.01em; margin:0; }
h1 i { color:var(--accent); }
.sub { color:var(--muted); font-size:12.5px; }
.status { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:7px; max-width:46ch; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.status::before { content:""; flex:none; width:7px; height:7px; border-radius:50%; background:var(--line-2); }
.status.run { color:var(--ink); } .status.run::before { background:var(--good); animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.25; } }
nav { max-width:1080px; margin:auto; padding:0 10px; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
nav button { border:0; background:none; color:var(--muted); padding:8px 6px 9px; margin:0 6px -1px; font:500 13.5px var(--sans); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
nav button:hover { color:var(--ink); }
nav button.on { color:var(--ink); border-color:var(--ink); }
nav .count { font:500 11.5px var(--mono); color:var(--muted); margin-left:5px; }
nav .count.hot { color:var(--signal); }

main { max-width:1080px; margin:auto; padding:8px 16px 64px; }
h2 { font:500 20px/1.25 var(--serif); margin:34px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
main > h2:first-child, main > .tiles:first-child + h2 { margin-top:22px; }
h2 .chip { background:none; padding:0; margin:0; font:400 13px var(--mono); color:var(--muted); }
h2 .b, h2 input { margin-left:auto; font:400 13px/1.3 var(--sans); }
h2 input { width:min(260px, 100%); }
h2 .b + .b { margin-left:0; }
.lede { color:var(--muted); font-size:13px; margin:-4px 0 12px; max-width:72ch; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin-bottom:10px; }
.muted { color:var(--muted); } .small { font-size:12.5px; }
[hidden] { display:none !important; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.grow { flex:1; min-width:0; }
.chip { display:inline-block; background:var(--chip); border-radius:var(--r2); padding:1px 7px; font-size:12px; margin:2px 4px 2px 0; }
.co { font-weight:600; } .role { color:var(--ink); }
.meta { color:var(--muted); font-size:12.5px; margin-top:2px; }
.card.working { outline:2px solid var(--accent); outline-offset:2px; }
.qa .l.done, .qa .v.done button { color:var(--good); } .qa .l.next { color:var(--ink); font-weight:600; } .qa .v.next { box-shadow:inset 3px 0 0 var(--accent); padding-left:8px; }
.v.cp { display:flex; gap:8px; align-items:flex-start; } .v.cp > :first-child { flex:1; min-width:0; } .v.cp > button { flex:none; min-width:68px; }
.chip.ease { display:inline-block; margin-bottom:6px; } .chip.ease.hard { color:var(--warn); }
.code-note { margin:10px 0 2px; padding:8px 12px; border-left:3px solid var(--warn); background:var(--chip); font-size:13px; }
.qid { font:500 12px var(--mono); color:var(--muted); margin-right:6px; }
.qtext { font:400 17px/1.35 var(--serif); }

button.b, a.b { border:1px solid var(--line-2); background:var(--card); color:var(--ink); border-radius:var(--r2); padding:6px 12px; font:500 13px/1.3 var(--sans); cursor:pointer; text-decoration:none; display:inline-block; transition:border-color .12s, background .12s; }
button.b:hover, a.b:hover { border-color:var(--ink); }
button.primary, button.good { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button.primary:hover, button.good:hover { border-color:var(--accent); filter:brightness(1.12); }
button.opt { background:var(--bg); }
button.quiet { border-color:transparent; background:none; color:var(--muted); }
button.quiet:hover { color:var(--ink); border-color:transparent; text-decoration:underline; }
button:disabled { opacity:.45; cursor:default; }
input, textarea, select { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line-2); border-radius:var(--r2); padding:6px 9px; }
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
textarea { width:100%; resize:vertical; line-height:1.5; }
input.text { width:100%; }
input[type=checkbox] { accent-color:var(--accent); }

.qa { display:grid; grid-template-columns:minmax(150px, 30%) 1fr; gap:0 16px; margin:14px 0 4px; border-top:1px solid var(--line); }
.qa > div { padding:8px 0; border-bottom:1px solid var(--line); min-width:0; }
.qa .l { color:var(--muted); font-size:12.5px; padding-top:10px; }
.qa .v { overflow-wrap:anywhere; }
@media (max-width:640px) { .qa { grid-template-columns:1fr; } .qa .l { border-bottom:0; padding-bottom:0; } }

.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(118px, 1fr)); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--card); margin-top:22px; }
.tile { display:flex; flex-direction:column; justify-content:space-between; padding:12px 14px 13px; border-left:1px solid var(--line); border-top:1px solid var(--line); margin:-1px 0 0 -1px; }
.tile span { display:block; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.tile b { display:block; font:400 30px/1.15 var(--serif); font-variant-numeric:tabular-nums; margin-top:2px; }
.tile.click { cursor:pointer; } .tile.click:hover { background:var(--bg); }
.tile.on { background:var(--chip); }
.tile.on span { color:var(--ink); }

table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:var(--r); }
th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:500; }
tr:last-child td { border-bottom:0; }
td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
.scroll { overflow-x:auto; }
.o-interview, .o-offer { color:var(--good); font-weight:600; } .o-oa { color:var(--warn); font-weight:600; } .o-rejected { color:var(--bad); }
.chip.o-interview, .chip.o-offer, .chip.o-oa, .chip.o-rejected { font-weight:500; }
.card.empty, .empty { color:var(--muted); font:italic 400 15.5px var(--serif); padding:18px; }
.why { font-size:13px; margin:10px 0 12px; padding-left:10px; border-left:2px solid var(--signal); }
.err { color:var(--bad); }
img.shot { max-width:100%; border:1px solid var(--line); border-radius:var(--r2); margin-top:10px; }
details summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
details summary:hover { color:var(--ink); }
pre { background:var(--chip); padding:12px; border-radius:var(--r2); overflow:auto; max-height:340px; font:12px/1.5 var(--mono); white-space:pre-wrap; }
code { font:12.5px var(--mono); background:var(--chip); padding:0 4px; border-radius:2px; }
.bars { display:flex; align-items:flex-end; gap:3px; height:120px; padding-top:8px; border-bottom:1px solid var(--line-2); }
.bars div { flex:1; background:var(--accent); min-height:1px; position:relative; opacity:.85; }
.bars div:hover { opacity:1; }
.bars div:hover::after { content:attr(data-t); position:absolute; bottom:100%; left:50%; transform:translate(-50%, -4px); background:var(--ink); color:var(--bg); font:11px var(--mono); padding:2px 6px; border-radius:2px; white-space:nowrap; }
.funnel div { display:grid; grid-template-columns:170px 1fr 44px 44px; align-items:center; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); }
.funnel div:last-child { border-bottom:0; }
.funnel .track { height:8px; background:var(--chip); border-radius:1px; }
.funnel span.f { display:block; height:100%; background:var(--accent); min-width:1px; }
.funnel b, .funnel .pct { font-variant-numeric:tabular-nums; text-align:right; font-weight:500; }
@media (max-width:520px) { .funnel div { grid-template-columns:110px 1fr 34px 40px; gap:8px; } }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:var(--r2); display:none; z-index:9; max-width:90vw; font-size:13px; }
.switch { display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
.switch input { margin-top:3px; width:17px; height:17px; flex:none; }
.switch b { font-weight:600; }
.setting + .setting { margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
.topic { font:13px var(--mono); background:var(--chip); padding:2px 7px; border-radius:var(--r2); user-select:all; }
@media (max-width:520px) { .bar { padding:12px 16px 6px; gap:6px 12px; } .sub { display:none; } h1 { font-size:22px; } .status { order:3; width:100%; max-width:none; } .card { padding:14px; } .tile b { font-size:25px; } }
.swatches { display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); gap:8px; }
.sw { display:flex; flex-direction:column; gap:6px; padding:8px; border:1px solid var(--line); border-radius:var(--r); background:var(--card); color:var(--ink); font:inherit; font-size:12.5px; cursor:pointer; text-align:left; }
.sw:hover { border-color:var(--line-2); } .sw.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.sw .chips { display:flex; height:26px; border-radius:var(--r2); overflow:hidden; border:1px solid var(--line); } .sw .chips i { flex:1; }
.seg { display:inline-flex; flex-wrap:wrap; justify-self:start; border:1px solid var(--line-2); border-radius:var(--r2); overflow:hidden; }
.seg button { border:0; background:none; color:var(--muted); padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer; }
.seg button + button { border-left:1px solid var(--line-2); } .seg button:hover { color:var(--ink); } .seg button.on { background:var(--accent); color:var(--accent-ink); }
.look { display:grid; grid-template-columns:110px 1fr; gap:12px 14px; align-items:center; margin-top:16px; }
@media (max-width:520px) { .look { grid-template-columns:1fr; gap:6px; } }
:root[data-density=compact] body { font-size:13px; } :root[data-density=compact] .card { padding:10px 12px; margin-bottom:6px; }
:root[data-density=compact] h2 { margin:20px 0 8px; font-size:18px; } :root[data-density=compact] .setting + .setting { margin-top:10px; padding-top:10px; }
:root[data-density=roomy] body { font-size:15px; } :root[data-density=roomy] .card { padding:20px 24px; margin-bottom:14px; }
</style>
<script>
// Appearance: per-browser preference (localStorage), applied before first paint so there's no flash.
// Colors: bg card ink muted line line-2 chip accent accent-ink signal good warn bad; [light, dark].
const PALETTES = {
  paper: ['Paper', '#f3f0e8 #fbfaf6 #1c1a16 #6b665c #ddd7ca #c9c1b0 #ebe6da #1f4d3a #f7f4ec #b4471c #2f6b3f #94650f #a3321f', '#15140f #1c1b16 #ece7db #9b9486 #2e2c25 #433f35 #25231d #8fbf9f #13130f #e0794a #8fbf9f #d9a74a #e07a64'],
  ocean: ['Ocean', '#eef3f7 #fafcfd #0f1a24 #5a6b7a #d6e0e8 #bccbd7 #e2eaf0 #1d5a8c #f4f8fb #c2551f #2c7a4b #9a6a0c #b23a2a', '#0d141b #131c25 #e3ecf3 #8b9cab #223040 #33465a #1a2531 #7fb6e6 #0b1118 #ec8a5a #7fcf9c #e0b25a #ee8471'],
  slate: ['Slate', '#f1f2f4 #fbfbfc #16181d #626873 #dcdfe4 #c4c9d1 #e7e9ed #3b4fd1 #f7f8ff #c2551f #2c7a4b #9a6a0c #b23a2a', '#111317 #171a1f #e6e8ec #969ba5 #262a31 #393e48 #1e2127 #95a3ff #0f1117 #ec8a5a #7fcf9c #e0b25a #ee8471'],
  plum: ['Plum', '#f5f1f5 #fcfafc #1f1620 #6e6070 #e3d8e4 #cfbfd1 #ece2ed #6b2d6e #faf5fa #b4471c #2f6b3f #94650f #a3321f', '#151017 #1c161e #eee4ef #a394a5 #2f2532 #463849 #251d28 #d3a1d6 #151017 #e8875a #8fc79f #dcae55 #e88272'],
  rose: ['Rose', '#f8f0f1 #fdf9f9 #241517 #7a6164 #ecd8db #dcbfc4 #f2e3e5 #b0325a #fff6f8 #1f5f8c #2f6b3f #94650f #a3321f', '#170f11 #1f1517 #f2e3e6 #ab9497 #352529 #4d363c #2a1c1f #f08aa8 #1a0f12 #7fb6e6 #8fc79f #dcae55 #ef8a76'],
  ember: ['Ember', '#f7f0ea #fdf9f6 #22160f #74635a #e8d9cd #d6c1b0 #f0e3d8 #a8401a #fdf6f0 #1f5f8c #2f6b3f #8d6410 #a3321f', '#17110d #1f1712 #f1e5db #a8968a #332720 #4a3a30 #2a1f19 #f0935e #1a110b #7fb6e6 #8fc79f #dcae55 #ef8a76'],
  solar: ['Solarized', '#fdf6e3 #fffbef #073642 #657b83 #eee8d5 #ddd6c1 #f3ecd7 #268bd2 #fdf6e3 #cb4b16 #859900 #b58900 #dc322f', '#002b36 #073642 #eee8d5 #93a1a1 #0f4553 #1d5866 #0a3c49 #2aa198 #002b36 #cb4b16 #859900 #b58900 #dc322f'],
  terminal: ['Terminal', '#eef3ec #f8fbf7 #0d1a0f #5b6b5d #d3dfd3 #b9cbb9 #e1ebe0 #1f7a33 #f4fbf4 #b4471c #1f7a33 #8a6d1f #a3321f', '#0a0f0a #0f160f #c8f5c8 #6f9a6f #1a2a1a #284028 #132013 #39d353 #061006 #ffb454 #39d353 #e6c84f #ff6b5b'],
  mono: ['Mono', '#f4f4f4 #ffffff #111111 #666666 #dddddd #c4c4c4 #ebebeb #111111 #ffffff #111111 #3d6b47 #8a6d1f #a3321f', '#0e0e0e #161616 #eeeeee #999999 #262626 #3a3a3a #1f1f1f #f0f0f0 #0e0e0e #f0f0f0 #8fbf9f #d9a74a #e07a64'],
};
const COLOR_KEYS = ['bg', 'card', 'ink', 'muted', 'line', 'line-2', 'chip', 'accent', 'accent-ink', 'signal', 'good', 'warn', 'bad'];
const FONTS = {
  editorial: ['Editorial', {}],
  modern: ['Modern', { serif: '"IBM Plex Sans", system-ui, sans-serif' }],
  classic: ['Classic', { serif: 'Georgia, "Times New Roman", serif', sans: 'Georgia, "Times New Roman", serif' }],
  typewriter: ['Typewriter', { serif: '"IBM Plex Mono", ui-monospace, monospace', sans: '"IBM Plex Mono", ui-monospace, monospace' }],
};
const CORNERS = { sharp: ['Sharp', 0, 0], soft: ['Soft', 4, 3], round: ['Round', 12, 8] };
const LOOK_DEFAULT = { palette: 'paper', mode: 'system', font: 'editorial', density: 'normal', corners: 'soft', accent: '' };
let LOOK = (() => { try { return { ...LOOK_DEFAULT, ...JSON.parse(localStorage.getItem('look') || '{}') }; } catch { return { ...LOOK_DEFAULT }; } })();
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => LOOK.mode === 'dark' || (LOOK.mode === 'system' && darkMQ.matches);
const paletteColors = (k, dark) => (PALETTES[k] || PALETTES.paper)[dark ? 2 : 1].split(' ');
const inkFor = hex => { const n = parseInt(hex.slice(1), 16), l = .299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255); return l > 150 ? '#111111' : '#ffffff'; };
function applyLook() {
  const st = document.documentElement.style, dark = isDark(), c = paletteColors(LOOK.palette, dark);
  COLOR_KEYS.forEach((k, i) => st.setProperty('--' + k, c[i]));
  if (/^#[0-9a-f]{6}$/i.test(LOOK.accent)) { st.setProperty('--accent', LOOK.accent); st.setProperty('--accent-ink', inkFor(LOOK.accent)); }
  ['serif', 'sans'].forEach(k => st.removeProperty('--' + k));
  Object.entries((FONTS[LOOK.font] || FONTS.editorial)[1]).forEach(([k, v]) => st.setProperty('--' + k, v));
  const [, r, r2] = CORNERS[LOOK.corners] || CORNERS.soft; st.setProperty('--r', r + 'px'); st.setProperty('--r2', r2 + 'px');
  st.colorScheme = dark ? 'dark' : 'light';
  document.documentElement.dataset.density = LOOK.density;
}
applyLook();
darkMQ.addEventListener('change', () => { applyLook(); if (typeof render === 'function' && tab === 'settings') render(); });
</script></head>
<body>
<header>
  <div class="bar"><div class="brand"><h1>Internship <i>Bot</i></h1><span class="sub">Summer 2027 applications</span></div>
    <span id="runpill" class="status">Loading</span>
    <button class="b" onclick="runNow()">Run now</button></div>
  <nav id="tabs"></nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div id="toast"></div>
<script>
const TABS = [['needs', 'Needs you'], ['apps', 'Applications'], ['pipeline', 'Pipeline'], ['insights', 'Insights'], ['profile', 'Profile'], ['settings', 'Settings']];
const OUT = [['', 'No response yet'], ['confirmed', 'Confirmation only'], ['oa', 'Assessment (OA)'], ['interview', 'Interview'], ['offer', 'Offer'], ['rejected', 'Rejected'], ['withdrawn', 'Withdrew']];
let ease = (() => { try { return localStorage.getItem('ease') || 'all'; } catch { return 'all'; } })();
const setEase = k => { ease = k; try { localStorage.setItem('ease', k); } catch {} render(); };
let S = null, tab = (() => { try { return localStorage.getItem('tab') || 'needs'; } catch { return 'needs'; } })();
let profFile = 'profile.yaml', appFilter = '', appSearch = '', dirty = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ago = t => { if (!t) return ''; const m = (Date.now() - t) / 6e4; return m < 60 ? Math.round(m) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
const date = t => t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500); };
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json', 'x-dashboard': '1' }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (j.error) { toast(j.error); throw new Error(j.error); }
  return j;
}
async function refresh() { S = await api('/api/state'); dirty = false; render(); }
const act = async (path, body, msg) => { await api(path, body); if (msg) toast(msg); await refresh(); };

function render() {
  const needs = S.questions.length + S.approvals.length + S.manual.length;
  document.title = needs ? `(${needs}) Internship Bot` : 'Internship Bot';
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) =>
    `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')">${l}${k === 'needs' && needs ? `<span class="count hot">${needs}</span>` : ''}</button>`).join('');
  const r = S.runner, pill = document.getElementById('runpill');
  pill.className = 'status' + (r.running ? ' run' : '');

function go(k) { tab = k; try { localStorage.setItem('tab', k); } catch {} render(); if (k === 'profile') loadProfile(); }

const where = j => [j.ats, j.locations?.length ? (j.locations.length > 2 ? `${j.locations.slice(0, 2).join(', ')} +${j.locations.length - 2}` : j.locations.join(', ')) : '', j.category].filter(Boolean).map(esc).join(' · ');

      <div class="row" style="margin-top:6px"><button class="b primary" onclick="answer(${q.id})">Save answer</button>

    // Easy: approve (maybe type a Greenhouse code). Hard: Ben sends it himself, copy-pasting the answers.

    const field = it => it.type === 'file' ? `<a class="chip" href="/files/${esc(it.value)}" download title="Download it">${esc(it.value)} ↓</a>`
      : it.type === 'textarea' || it.value.length > 90 ? `<textarea rows="${Math.min(10, 2 + Math.ceil(it.value.length / 90))}" data-k="${esc(it.key)}" oninput="dirty=true">${esc(it.value)}</textarea>`
      : ['select', 'multiselect', 'location', 'education'].includes(it.type) ? `<span class="chip" title="Picked from the form's own list">${esc(it.type === 'education' ? 'Virginia Tech, CS, Aug 2024 to May 2028' : it.value)}</span>`
      : `<input class="text" data-k="${esc(it.key)}" value="${esc(it.value)}" oninput="dirty=true">`;
    // Copy mode: each row gets a Copy button; copied rows go green and the next one is highlighted.
    const qa = (j, copy) => { const its = copy ? [...j.items].sort((x, y) => (y.type === 'file') - (x.type === 'file')) : j.items;   // resume first: Ashby autofills from it
      const next = copy && its.find(it => !copied.has(j.id + ':' + it.key));
      return `<div class="qa">${its.map(it => { const st = !copy ? '' : copied.has(j.id + ':' + it.key) ? ' done' : it === next ? ' next' : '';
        const v = it.type === 'file' ? it.path : it.type === 'education' ? 'Virginia Tech, CS, Aug 2024 to May 2028' : it.value;
        return `<div class="l${st}">${esc(it.label)}</div><div class="v${copy ? ' cp' : ''}${st}" data-ck="${esc(j.id + ':' + it.key)}">${field(it)}${copy
          ? `<button class="b quiet" onclick="copyVal(this)" data-v="${esc(v)}" title="${it.type === 'file' ? 'In the upload dialog: Ctrl+L, Ctrl+V, Enter' : ''}">${it.type === 'file' ? 'Copy path' : 'Copy'}</button>` : ''}</div>`; }).join('')}</div>`; };
    const yourself = j => `<button class="b primary" onclick="openForm('${j.id}')" title="Form on the left half of the screen, this window on the right">Open form</button>

    const apps = S.approvals.filter(show).sort((x, y) => hard(x) - hard(y));

  },
  apps() {

  pipeline() {

function lookCard() {
  const dark = isDark(), seg = (k, opts) => `<div class="seg" role="group">${Object.entries(opts).map(([v, label]) =>
    `<button class="${LOOK[k] === v ? 'on' : ''}" aria-pressed="${LOOK[k] === v}" onclick="setLook('${k}','${v}')">${label}</button>`).join('')}</div>`;
  const pick = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, v[0]]));
  return `<h2>Appearance</h2><div class="card">
    <div class="swatches">${Object.entries(PALETTES).map(([k, [name]]) => { const c = paletteColors(k, dark);
      return `<button class="sw ${LOOK.palette === k ? 'on' : ''}" aria-pressed="${LOOK.palette === k}" onclick="setLook('palette','${k}')">
        <span class="chips"><i style="background:${c[0]}"></i><i style="background:${c[1]}"></i><i style="background:${c[7]}"></i><i style="background:${c[9]}"></i><i style="background:${c[2]}"></i></span>${name}</button>`; }).join('')}</div>
    <div class="look">
      <span class="small muted">Mode</span>${seg('mode', { system: 'Match system', light: 'Light', dark: 'Dark' })}
      <span class="small muted">Type</span>${seg('font', pick(FONTS))}
      <span class="small muted">Density</span>${seg('density', { compact: 'Compact', normal: 'Normal', roomy: 'Roomy' })}
      <span class="small muted">Corners</span>${seg('corners', pick(CORNERS))}
      <span class="small muted">Accent</span><div class="row"><input type="color" value="${LOOK.accent || paletteColors(LOOK.palette, dark)[7]}" oninput="setLook('accent',this.value,true)" onchange="setLook('accent',this.value)" aria-label="Custom accent color" style="width:44px;height:30px;padding:2px">
        <span class="small muted">${LOOK.accent ? 'Custom accent.' : "Using the palette's accent."}</span>${LOOK.accent ? `<button class="b" onclick="setLook('accent','')">Reset</button>` : ''}</div>
    </div>
    <div class="row" style="margin-top:14px"><span class="small muted">Saved in this browser only.</span><button class="b" onclick="LOOK={...LOOK_DEFAULT};setLook()">Back to default</button></div></div>`;
}
function setLook(k, v, live) {
  if (k) LOOK[k] = v;
  try { localStorage.setItem('look', JSON.stringify(LOOK)); } catch {}
  applyLook(); if (!live) render();
}
async function answer(id, preset) {
  const v = preset ?? document.getElementById('ans' + id).value.trim();
  if (!v) return toast('Type an answer first');
  const r = await api('/api/answer', { id, answer: v });
  toast(`Saved.${r.released ? ` ${r.released} job(s) back in line.` : ''}`); await refresh();
}
async function approve(id) {
  const edits = {};
  document.querySelectorAll(`#ap-${id} [data-k]`).forEach(el => edits[el.dataset.k] = el.value);
  await act('/api/approve', { id, edits }, 'Approved: submitting in the background');
}
let working = null, formWin = null; const copied = new Set();
// Hard jobs in the order they're shown, for "Mark as applied → next".
const hardList = () => [...S.approvals.filter(j => j.ats === 'Ashby'), ...S.manual];
function copyVal(btn) {
  const el = btn.parentElement.querySelector('input, textarea'), row = btn.parentElement;
  navigator.clipboard.writeText(el ? el.value : btn.dataset.v).then(() => {
    copied.add(row.dataset.ck); btn.textContent = 'Copied'; setTimeout(() => btn.textContent = btn.title ? 'Copy path' : 'Copy', 1200);
    const rows = [...row.parentElement.querySelectorAll('.v')];
    rows.forEach(r => { const on = copied.has(r.dataset.ck); r.classList.toggle('done', on); r.previousElementSibling.classList.toggle('done', on); r.classList.remove('next'); r.previousElementSibling.classList.remove('next'); });
    const nx = rows.find(r => !copied.has(r.dataset.ck));
    if (nx) { nx.classList.add('next'); nx.previousElementSibling.classList.add('next'); nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }, () => toast("Couldn't copy"));
}
// The form opens on the left half (same named window each time, so it reuses it); this window moves to the right half.
function openForm(id) {
  const j = [...S.approvals, ...S.manual].find(x => x.id === id), w = Math.floor(screen.availWidth / 2), h = screen.availHeight;
  const f = window.open(j.form, 'ibform', `popup,left=${screen.availLeft},top=${screen.availTop},width=${w},height=${h}`);
  if (!f) return toast('Chrome blocked the window: click Open form');
  formWin = f;
  try { f.moveTo(screen.availLeft, screen.availTop); f.resizeTo(w, h); } catch {}
  api('/api/tile', { mode: 'unmax' }).then(() => setTimeout(() => { window.resizeTo(w, h); setTimeout(() => window.moveTo(screen.availLeft + w, screen.availTop), 300); }, 250));
  working = id; render(); api('/api/watch', { id });
  setTimeout(() => document.getElementById('ap-' + id)?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 50);
}
// Done for now: close the form window and give the dashboard the whole screen back.
async function appliedDone(id, seen) {
  if (!seen) await api('/api/manual-done', { id, applied: true });
  toast(seen ? 'Saw the confirmation email: marked applied' : 'Logged as applied');
  working = null; formWin?.close(); await api('/api/tile', { mode: 'max' }); await refresh();
}
// While a form is open, the inbox watcher flips it to applied when the confirmation email lands.
setInterval(async () => {
  if (!working) return;
  const id = working, { status } = await api('/api/status?id=' + id).catch(() => ({}));
  if (status === 'applied' && working === id) appliedDone(id, true);
}, 3000);
async function appliedNext(id) {
  const list = hardList(), next = list[list.findIndex(j => j.id === id) + 1] || list.find(j => j.id !== id);
  await act('/api/manual-done', { id, applied: true }, 'Logged as applied');
  if (next) openForm(next.id); else working = null;
}
async function approveAll() {
  if (dirty) return toast('You have unsaved edits: approve those jobs one at a time');
  await act('/api/approve-all', {}, 'All approved: submitting in the background');
}
const setOutcome = (id, outcome) => { const h = S.history.find(x => x.id === id); act('/api/outcome', { id, outcome, notes: h.notes }, 'Saved'); };
const setNotes = (id, notes) => { const h = S.history.find(x => x.id === id); act('/api/outcome', { id, outcome: h.outcome || '', notes }, 'Note saved'); };
async function runNow(n = 5) { const r = await api('/api/run', { apply: n }); toast(r.started ? 'Started' : 'Already running'); setTimeout(refresh, 1500); }
async function setAuto(el) {
  if (el.checked && !confirm('Turn on auto-submit? New applications will be sent without your review.')) { el.checked = false; return; }
  await act('/api/settings', { auto_submit: el.checked }, el.checked ? 'Auto-submit on' : 'Auto-submit off');
}
async function setWorkday(el) {
  if (el.checked && !confirm('Let the bot create a Workday candidate account at each company, in your name?')) { el.checked = false; return; }
  await act('/api/settings', { workday: el.checked }, el.checked ? 'Workday on: those jobs join the line' : 'Workday off');
}
async function loadProfile() { const r = await api('/api/profile?file=' + profFile); const t = document.getElementById('prof'); if (t) { t.value = r.text; dirty = false; } }
async function saveProfile() { await api('/api/profile', { file: profFile, text: document.getElementById('prof').value }); dirty = false; toast('Saved ' + profFile); }
async function saveMail() {
  const user = document.getElementById('mu').value.trim(), password = document.getElementById('mp').value;
  if (!user || !password) return toast('Enter both the address and the app password');
  await act('/api/mail', { user, password }, 'Saved');
}
async function checkMail(btn) {
  btn.disabled = true; btn.textContent = 'Checking…';
  const r = await api('/api/mail-check', {});
  await refresh();
  const o = document.getElementById('mailout'); o.style.display = 'block'; o.textContent = r.out || 'done';
}
// Live refresh, but never while you're typing.
setInterval(() => {
  const a = document.activeElement;
  if (!dirty && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) && !document.querySelector('details[open]:not(:has(pre))')) refresh().catch(() => {});
}, 10000);
refresh();
</script>
