<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Visualizer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d0e12;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 12px;
    color: #f0f0f0;
    letter-spacing: 0.02em;
  }
  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: #b8b8b8;
    max-width: 940px;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 10px;
    border-left: 1px solid #2c2f37;
  }
  .control-group:first-child { border-left: none; padding-left: 0; }
  button.action, select {
    padding: 7px 12px;
    border-radius: 6px;
    border: none;
    background: #23262c;
    color: #e8e8e8;
    font-size: 13px;
    cursor: pointer;
  }
  button.action:hover { background: #2c3038; }
  button.action.active { background: #3a3040; box-shadow: 0 0 0 1px #6a5a80 inset; }
  input[type="file"] { color: #b8b8b8; font-size: 12px; max-width: 180px; }
  #canvasWrap {
    border: 1px solid #2c2f37;
    border-radius: 8px;
    overflow: hidden;
    line-height: 0;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  canvas { display: block; background: #0a0b0e; }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #777;
    text-align: center;
    max-width: 700px;
  }
</style>
</head>
<body>

<h1>Music Visualizer</h1>

<div id="toolbar">
  <div class="control-group">
    <input type="file" id="fileInput" accept="audio/*">
    <button class="action" id="playPauseBtn" disabled>Play</button>
  </div>
  <div class="control-group">
    <button class="action" id="micBtn">Enable Mic</button>
  </div>
  <div class="control-group">
    <label for="modeSelect">Mode</label>
    <select id="modeSelect">
      <option value="bars">Bars</option>
      <option value="radial">Radial</option>
      <option value="particles">Particles</option>
    </select>
  </div>
  <div class="control-group">
    <label for="sensitivity">Sensitivity</label>
    <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1.4">
  </div>
</div>

<div id="canvasWrap">
  <canvas id="c" width="900" height="500"></canvas>
</div>

<div id="status">Upload an audio file or enable your mic to begin.</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const statusEl = document.getElementById("status");
  const fileInput = document.getElementById("fileInput");
  const micBtn = document.getElementById("micBtn");
  const playPauseBtn = document.getElementById("playPauseBtn");
  const modeSelect = document.getElementById("modeSelect");
  const sensitivitySlider = document.getElementById("sensitivity");

  let audioCtx = null;
  let analyser = null;
  let freqData = null, timeData = null;

  let mediaElSource = null;
  let micSourceNode = null;
  let micStream = null;
  let activeSource = null; // 'file' | 'mic' | null

  const audioEl = new Audio();

  let silentGain = null;

  function ensureGraph() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.8;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);

    // The Web Audio graph is pull-driven from the destination node: a node
    // with no path (even indirect) to destination may never actually get
    // processed in some browsers. The mic path is deliberately never routed
    // to real audio output (to avoid feedback), so give it a silent path
    // instead purely to keep the graph "live" for the analyser.
    silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    silentGain.connect(audioCtx.destination);
  }

  function stopMic() {
    if (micSourceNode) { micSourceNode.disconnect(); micSourceNode = null; }
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    micBtn.textContent = "Enable Mic";
    micBtn.classList.remove("active");
  }

  // ---- File playback ----
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      ensureGraph();
      if (audioCtx.state === "suspended") await audioCtx.resume();

      stopMic();
      audioEl.pause();

      // Opening this page via file:// (double-click, no local server) gives it
      // an opaque origin, under which Chromium's blob: URLs never resolve
      // (blob:null/... -> ERR_FILE_NOT_FOUND). A data: URL works from any
      // origin, so read the file that way instead.
      statusEl.textContent = "Loading: " + file.name;
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
      audioEl.src = dataUrl;

      if (!mediaElSource) {
        mediaElSource = audioCtx.createMediaElementSource(audioEl);
        mediaElSource.connect(analyser);       // tap for visualization
        mediaElSource.connect(audioCtx.destination); // actually hear it
      }
      activeSource = "file";
      await audioEl.play();
      playPauseBtn.disabled = false;
      playPauseBtn.textContent = "Pause";
      statusEl.textContent = "Playing: " + file.name;
    } catch (err) {
      statusEl.textContent = "Could not play file: " + err.message;
    }
  });

  playPauseBtn.addEventListener("click", () => {
    if (!audioEl.src) return;
    if (audioEl.paused) {
      audioEl.play();
      playPauseBtn.textContent = "Pause";
    } else {
      audioEl.pause();
      playPauseBtn.textContent = "Play";
    }
  });

  audioEl.addEventListener("ended", () => { playPauseBtn.textContent = "Play"; });

  // ---- Microphone ----
  micBtn.addEventListener("click", async () => {
    if (activeSource === "mic") {
      stopMic();
      activeSource = null;
      statusEl.textContent = "Mic disabled.";
      return;
    }
    try {
      ensureGraph();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      audioEl.pause();
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      micSourceNode = audioCtx.createMediaStreamSource(micStream);
      micSourceNode.connect(analyser);
      micSourceNode.connect(silentGain); // keeps the graph "live" without any audible feedback
      activeSource = "mic";
      micBtn.textContent = "Disable Mic";
      micBtn.classList.add("active");
      statusEl.textContent = "Listening to microphone...";
    } catch (err) {
      statusEl.textContent = "Could not access microphone: " + err.message;
    }
  });

  // ---- Visualization ----
  const barCount = 80;
  const hueOffset = { v: 0 };

  function bandValue(i, count, data) {
    const bins = data.length;
    const t0 = i / count, t1 = (i + 1) / count;
    let start = Math.floor(Math.pow(bins, t0));
    let end = Math.max(start + 1, Math.floor(Math.pow(bins, t1)));
    if (end > bins) end = bins;
    let sum = 0, n = 0;
    for (let b = start; b < end; b++) { sum += data[b]; n++; }
    return n ? sum / n : 0;
  }

  function bassEnergy(data) {
    // roughly the lowest ~6% of bins
    const n = Math.max(1, Math.floor(data.length * 0.06));
    let sum = 0;
    for (let i = 0; i < n; i++) sum += data[i];
    return sum / n / 255;
  }

  const bassHistory = [];
  function isBeat(bass) {
    bassHistory.push(bass);
    if (bassHistory.length > 40) bassHistory.shift();
    const avg = bassHistory.reduce((a, b) => a + b, 0) / bassHistory.length;
    return bass > 0.28 && bass > avg * 1.35;
  }

  function drawBars(sens, flash) {
    ctx.fillStyle = flash ? "rgba(30,26,20,0.35)" : "rgba(10,11,14,0.28)";
    ctx.fillRect(0, 0, W, H);

    const barW = W / barCount;
    for (let i = 0; i < barCount; i++) {
      const v = bandValue(i, barCount, freqData) / 255;
      const h = Math.min(H * 0.95, v * sens * H);
      const hue = (i / barCount) * 260 + hueOffset.v;
      ctx.fillStyle = `hsl(${hue}, 85%, ${45 + v * 25}%)`;
      ctx.fillRect(i * barW + 1, H - h, barW - 2, h);
    }
    hueOffset.v = (hueOffset.v + 0.15) % 360;
  }

  let radialAngle = 0;
  function drawRadial(sens, flash) {
    ctx.fillStyle = flash ? "rgba(30,26,20,0.30)" : "rgba(10,11,14,0.22)";
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2;
    const innerR = Math.min(W, H) * 0.14;
    const spokes = 96;
    radialAngle += 0.0035;

    for (let i = 0; i < spokes; i++) {
      const v = bandValue(i, spokes, freqData) / 255;
      const len = v * sens * Math.min(W, H) * 0.38;
      const angle = (i / spokes) * Math.PI * 2 + radialAngle;
      const x0 = cx + Math.cos(angle) * innerR, y0 = cy + Math.sin(angle) * innerR;
      const x1 = cx + Math.cos(angle) * (innerR + len), y1 = cy + Math.sin(angle) * (innerR + len);
      const hue = (i / spokes) * 300 + hueOffset.v;
      ctx.strokeStyle = `hsl(${hue}, 85%, ${50 + v * 25}%)`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.stroke();
    hueOffset.v = (hueOffset.v + 0.2) % 360;
  }

  const particles = [];
  function drawParticles(sens, flash, bass, treble) {
    ctx.fillStyle = "rgba(10,11,14,0.22)";
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2;

    if (flash) {
      const count = 6 + Math.floor(bass * 20);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (1.5 + Math.random() * 3) * sens * (0.6 + bass);
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 4 + bass * 6,
          life: 1,
          hue: (treble * 200 + hueOffset.v) % 360,
        });
      }
    }

    const coreR = 20 + bass * sens * 60;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    grad.addColorStop(0, `hsla(${hueOffset.v}, 90%, 65%, 0.9)`);
    grad.addColorStop(1, `hsla(${hueOffset.v}, 90%, 45%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.life -= 0.012;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, 85%, 60%, ${p.life})`;
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    hueOffset.v = (hueOffset.v + 0.25) % 360;
  }

  function drawIdle() {
    ctx.fillStyle = "#0a0b0e";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#444";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("waiting for audio...", W / 2, H / 2);
  }

  function loop() {
    requestAnimationFrame(loop);

    if (!analyser || !activeSource) { drawIdle(); return; }

    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    const sens = parseFloat(sensitivitySlider.value);
    const bass = bassEnergy(freqData);
    const treble = bandValue(70, 80, freqData) / 255;
    const flash = isBeat(bass);

    const mode = modeSelect.value;
    if (mode === "bars") drawBars(sens, flash);
    else if (mode === "radial") drawRadial(sens, flash);
    else drawParticles(sens, flash, bass, treble);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
