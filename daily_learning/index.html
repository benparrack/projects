<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Learning</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #14161a;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
    min-height: 100vh;
  }
  #app { width: 100%; max-width: 700px; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    color: #f0f0f0;
    letter-spacing: 0.02em;
  }
  #streak {
    font-size: 13px;
    color: #b8a0d0;
    background: #23262c;
    border: 1px solid #33373f;
    border-radius: 999px;
    padding: 4px 12px;
  }
  #controls { margin-bottom: 16px; }
  button.action {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    background: #3a3040;
    color: #e8e8e8;
    font-size: 13px;
    cursor: pointer;
  }
  button.action:hover { background: #4a3d54; }
  button.action:disabled { opacity: 0.5; cursor: default; }
  #topicCard {
    background: #1c1e24;
    border: 1px solid #33373f;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    min-height: 120px;
  }
  #loading { color: #888; font-size: 14px; }
  #thumb {
    max-width: 100%;
    max-height: 280px;
    display: block;
    margin: 0 auto 16px;
    border-radius: 6px;
    border: 1px solid #33373f;
  }
  #title { font-size: 22px; margin: 0 0 4px; color: #f0f0f0; }
  #description { font-size: 14px; color: #a8a0b8; margin: 0 0 16px; font-style: italic; }
  #extract { font-size: 15px; line-height: 1.6; color: #d4d4d4; }
  #extract p { margin: 0 0 14px; }
  #extract h3, #extract h4 { color: #f0f0f0; margin: 20px 0 8px; }
  #extract h3 { font-size: 17px; }
  #extract h4 { font-size: 15px; color: #cfc0dc; }
  #wikiLink {
    display: inline-block;
    margin-top: 8px;
    font-size: 13px;
    color: #b8a0d0;
    text-decoration: none;
  }
  #wikiLink:hover { text-decoration: underline; }
  #historyPanel {
    margin-top: 20px;
    background: #1c1e24;
    border: 1px solid #33373f;
    border-radius: 10px;
    padding: 12px 16px;
  }
  #historyPanel summary {
    cursor: pointer;
    font-size: 13px;
    color: #b8b8b8;
    outline: none;
  }
  #historyList {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
    max-height: 260px;
    overflow-y: auto;
  }
  #historyList li { margin-bottom: 4px; }
  button.historyItem {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: #ccc;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  button.historyItem:hover { background: #23262c; color: #f0f0f0; }
  #historyList .hdate { color: #888; margin-right: 8px; font-variant-numeric: tabular-nums; }
  footer {
    margin-top: 20px;
    font-size: 12px;
    color: #666;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Daily Learning</h1>
    <div id="streak">— day streak</div>
  </header>
  <div id="controls">
    <button class="action" id="newTopicBtn">New random topic</button>
  </div>
  <div id="topicCard">
    <div id="loading">Loading a new topic…</div>
    <div id="content" hidden>
      <img id="thumb" hidden>
      <h2 id="title"></h2>
      <p id="description"></p>
      <div id="extract"></div>
      <a id="wikiLink" target="_blank" rel="noopener">Read the full article on Wikipedia →</a>
    </div>
  </div>
  <details id="historyPanel">
    <summary>History (<span id="historyCount">0</span> <span id="historyDayWord">days</span> learned)</summary>
    <ul id="historyList"></ul>
  </details>
  <footer>A new random topic each day, pulled from Wikipedia. Revisits show the same topic until you ask for a new one.</footer>
</div>
<script>
  const STORAGE_KEY = 'dailyLearning:history';

  function todayKey() {
    return new Date().toISOString().slice(0, 10);
  }

  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  function saveHistory(history) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) { /* storage full or unavailable — carry on without persistence */ }
  }

  async function fetchFullExtract(title) {
    try {
      const url = 'https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&format=json&origin=*&titles=' + encodeURIComponent(title);
      const res = await fetch(url);
      const data = await res.json();
      const pages = data.query && data.query.pages;
      const page = pages && Object.values(pages)[0];
      return (page && page.extract) || null;
    } catch (e) {
      return null;
    }
  }

  async function fetchRandomTopic() {
    for (let i = 0; i < 6; i++) {
      try {
        const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary');
        if (!res.ok) continue;
        const data = await res.json();
        if (data.type !== 'standard') continue;
        if (!data.extract || data.extract.length < 200) continue;
        const full = await fetchFullExtract(data.title);
        return {
          date: todayKey(),
          title: data.title,
          description: data.description || '',
          extract: full || data.extract,
          thumbnail: (data.thumbnail && data.thumbnail.source) || (data.originalimage && data.originalimage.source) || null,
          url: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) || null
        };
      } catch (e) { /* try again */ }
    }
    throw new Error('Could not find a topic after several tries');
  }

  function render(topic) {
    document.getElementById('title').textContent = topic.title;
    document.getElementById('description').textContent = topic.description;
    const thumb = document.getElementById('thumb');
    if (topic.thumbnail) {
      thumb.src = topic.thumbnail;
      thumb.hidden = false;
    } else {
      thumb.hidden = true;
    }
    const extractEl = document.getElementById('extract');
    extractEl.innerHTML = '';
    topic.extract.split(/\n+/).forEach(p => {
      p = p.trim();
      if (!p) return;
      const heading = p.match(/^(={1,4})\s*(.+?)\s*\1$/);
      if (heading) {
        const level = heading[1].length;
        const el = document.createElement(level <= 2 ? 'h3' : 'h4');
        el.textContent = heading[2];
        extractEl.appendChild(el);
        return;
      }
      const el = document.createElement('p');
      el.textContent = p;
      extractEl.appendChild(el);
    });
    const link = document.getElementById('wikiLink');
    link.href = topic.url || ('https://en.wikipedia.org/wiki/' + encodeURIComponent(topic.title.replace(/ /g, '_')));
    document.getElementById('content').hidden = false;
    document.getElementById('loading').hidden = true;
  }

  function computeStreak(history) {
    let streak = 0;
    const cursor = new Date();
    for (;;) {
      const key = cursor.toISOString().slice(0, 10);
      if (history[key]) {
        streak++;
        cursor.setUTCDate(cursor.getUTCDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function renderHistory(history) {
    const dates = Object.keys(history).sort().reverse();
    document.getElementById('historyCount').textContent = dates.length;
    document.getElementById('historyDayWord').textContent = dates.length === 1 ? 'day' : 'days';
    const streak = computeStreak(history);
    document.getElementById('streak').textContent = streak + ' day' + (streak === 1 ? '' : 's') + ' streak';
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    dates.forEach(d => {
      const item = history[d];
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'historyItem';
      const dateSpan = document.createElement('span');
      dateSpan.className = 'hdate';
      dateSpan.textContent = d;
      btn.appendChild(dateSpan);
      btn.appendChild(document.createTextNode(item.title));
      btn.addEventListener('click', () => render(item));
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  let history = loadHistory();

  async function loadToday(force) {
    const key = todayKey();
    if (!force && history[key]) {
      render(history[key]);
      renderHistory(history);
      return;
    }
    const btn = document.getElementById('newTopicBtn');
    btn.disabled = true;
    document.getElementById('loading').hidden = false;
    document.getElementById('loading').textContent = 'Loading a new topic…';
    document.getElementById('content').hidden = true;
    try {
      const topic = await fetchRandomTopic();
      history[key] = topic;
      saveHistory(history);
      render(topic);
      renderHistory(history);
    } catch (e) {
      document.getElementById('loading').textContent = 'Could not load a topic — check your connection and try again.';
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('newTopicBtn').addEventListener('click', () => loadToday(true));
  renderHistory(history);
  loadToday(false);
</script>
</body>
</html>
