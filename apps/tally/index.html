<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tally</title>
<meta name="description" content="A calorie and weight tracker: log food fast, follow the trend, hit your goal.">
<meta name="theme-color" content="#eeece6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally">
<link rel="preload" href="archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main id="view"></main>
  <button id="fab" class="fab" data-act="add" aria-label="Add food"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-view="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/></svg><span>Today</span></a>
    <a href="#progress" data-view="progress"><svg viewBox="0 0 24 24"><path d="M4 6l5 5 4-3 7 8"/><path d="M4 20h16"/></svg><span>Progress</span></a>
    <a href="#foods" data-view="foods"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Foods</span></a>
    <a href="#plan" data-view="plan"><svg viewBox="0 0 24 24"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/></svg><span>Plan</span></a>
  </nav>
</div>
<dialog id="sheet" aria-label="Panel"><div id="sheet-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="foods.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
