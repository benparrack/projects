<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Nowhere House</title>
<link rel="icon" href="icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d16; overflow: hidden; font-family: Georgia, serif; color: #e8e0c8; }
  #c { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #c:active { cursor: grabbing; }
  #intro { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none;
    background: radial-gradient(transparent, #0b0d16cc); transition: opacity 1.5s; }
  #intro h1 { font-weight: normal; letter-spacing: .3em; font-size: clamp(28px, 5vw, 56px); margin: 0 0 .6em; }
  #intro p { opacity: .75; margin: .3em; font-style: italic; }
  #intro.gone { opacity: 0; }
  #caption { position: fixed; left: 0; right: 0; bottom: 12%; text-align: center; font-style: italic; font-size: 22px;
    opacity: 0; transition: opacity 1s; pointer-events: none; text-shadow: 0 0 12px #000; }
  #caption.on { opacity: .9; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro">
  <h1>THE NOWHERE HOUSE</h1>
  <p>W A S D to walk · drag to look · shift to hurry</p>
  <p>the doors don't go where they should</p>
</div>
<div id="caption"></div>
<script type="module" src="main.js"></script>
</body>
</html>
